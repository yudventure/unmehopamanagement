<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Turtle System — Staff — Loading…</title>
<style>
  html,body{height:100%;margin:0}
  body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(160deg,#0369A1,#0E4B4F);
       color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
  .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;
        border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}
  @keyframes s{to{transform:rotate(360deg)}}
  a{color:#CDEBFB}
</style>
<script>
  /* ===== EDIT THIS ONE LINE if you rename the real staff file ===== */
  var REAL_APP = "turtle_staff_system_19_3.html";
  /* ================================================================ */
  try { location.replace(REAL_APP + "?v=" + (Date.now ? Date.now() : new Date().getTime())); }
  catch (e) { location.href = REAL_APP; }
</script>
</head>
<body>
  <div>
    <div class="spin"></div>
    <div>Loading Turtle System (Staff)…</div>
    <p style="font-size:13px;opacity:.85;margin-top:12px"><a id="lnk" href="turtle_staff_system_19_3.html">Tap here if it doesn't open</a></p>
  </div>
  <script>(function(){var t=(Date.now?Date.now():new Date().getTime());document.getElementById('lnk').href=REAL_APP+"?v="+t;})();</script>
</body>
</html>
