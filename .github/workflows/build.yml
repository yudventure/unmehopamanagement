# Builds the application somewhere with enough memory, so the server does not
# have to have any.
#
# Measured on this repository: `next build` peaks at about 1.4 GB of resident
# memory across its worker processes. That is comfortable on a build machine
# and is the single thing most likely to fail on shared hosting, where the
# ceiling belongs to the plan rather than to the machine. Building here removes
# the question instead of answering it.
#
# The output is `app.tar.gz`, which unpacks into a folder that runs with one
# command and no `npm install`. Download it from the run's Artifacts section.
#
# This is the way out that is actually used: the site runs on shared hosting
# that cannot build, so the build happens here and the result is published
# ready to run.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed only by the last step, which pushes the built app to its own
    # branch. Everything before it reads.
    permissions:
      contents: write

    # Everything here is read at `next build` and baked into the output, so it
    # has to be present now rather than on the server. Repository variables
    # rather than secrets on purpose: a domain name is public, and anything
    # prefixed NEXT_PUBLIC_ is compiled into the JavaScript the browser
    # downloads, so calling it a secret would be a promise this cannot keep.
    #
    # The real secrets (Midtrans server key, Resend, the CMS password) are read
    # at runtime and belong on the server, never here.
    env:
      SITE_DOMAIN_TURTLE: ${{ vars.SITE_DOMAIN_TURTLE }}
      SITE_DOMAIN_EDDO: ${{ vars.SITE_DOMAIN_EDDO }}
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ vars.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
      NEXT_PUBLIC_LOGIN_HERO: ${{ vars.NEXT_PUBLIC_LOGIN_HERO }}

      # Read by the optional SSH step at the end. Declared at job level rather
      # than on the step, because a step cannot see its own `env` from its `if`,
      # and that `if` is what keeps this whole path dormant until someone adds
      # the secrets.
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

      # The host's own "pull now" URL, and the address to watch afterwards.
      # Declared here for the same reason as the SSH block: a step cannot read
      # its own `env` from its `if`, and those `if`s are what keep both paths
      # dormant for anyone who has not set them up.
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      SITE_URL: ${{ vars.SITE_URL }}

      # Database. Di tingkat job untuk alasan yang sama dengan blok SSH: `if`
      # sebuah langkah tidak bisa membaca `env` miliknya sendiri, dan `if` itu
      # yang membuat langkah migrasi tidur sampai secret-nya diisi.
      #
      # `DIRECT_URL` yang dipakai migrasi, bukan yang lewat pooler: migrasi
      # mengambil kunci tingkat sesi yang tidak selamat melewati pooler
      # transaksi. `prisma7.config.ts` sudah mendahulukannya, jadi keduanya
      # cukup diberikan dan ia memilih sendiri.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - uses: actions/checkout@v4

      # Pinned to the major version the application is developed against. A
      # newer Node is usually fine and occasionally is not, and a build that
      # differs from the one that was tested is not worth the surprise.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` rather than `install`: it installs exactly what the lockfile says
      # and fails if the lockfile and package.json disagree, which is what you
      # want from a build you are going to deploy without looking at.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Copies public/ and .next/static in beside the server, then writes the
      # archive. Without this the site comes up unstyled rather than broken,
      # which is the harder failure to spot.
      - run: npm run package:archive

      # Menerapkan migrasi yang belum pernah dijalankan ke database.
      #
      # Letaknya di sini, bukan lebih awal, dan itu disengaja. Ditaruh sebelum
      # `npm run build`, sebuah kesalahan ketik di TypeScript akan menghentikan
      # run *sesudah* skema database sudah terlanjur berubah — tertinggal maju
      # sendirian, tanpa kode yang memakainya. Ditaruh di sini, build harus
      # berhasil dulu, jadi yang gagal tidak pernah sempat menyentuh database.
      #
      # Dan tetap sebelum penerbitan ke branch `deploy`, karena urutannya
      # memang harus begitu: kolom yang dibutuhkan kode baru sudah ada sebelum
      # kode itu mulai melayani permintaan.
      #
      # `migrate deploy`, bukan `migrate dev`: ia hanya menerapkan berkas
      # migrasi yang sudah ada dan tidak pernah mengarang yang baru, tidak
      # pernah menghapus data, dan tidak pernah bertanya. Sudah diterapkan
      # berarti dilewati, jadi menjalankannya berulang aman.
      #
      # Tidur sampai `DIRECT_URL` diisi. Tanpa itu tidak ada database untuk
      # dimigrasi, dan langkah yang gagal karenanya akan memerahkan build yang
      # sebenarnya baik-baik saja.
      - name: Terapkan migrasi database
        if: github.ref == 'refs/heads/main' && env.DIRECT_URL != ''
        run: npx prisma migrate deploy

      # Both formats, because which one an upload form will accept is not
      # knowable from here: Hostinger's lists .zip, .tar and .tar.gz and still
      # refused a .tar.gz, most likely over the filename a browser gave it on
      # the way down rather than the bytes inside.
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            dist/app.tar.gz
            dist/app.zip
          retention-days: 14

      # Publishes the built application to a branch of its own, so the host can
      # deploy by pulling instead of waiting for somebody to download an
      # archive and upload it again.
      #
      # That last step was the one part of the chain still done by hand, which
      # meant every price the owner changed in the CMS sat in GitHub until a
      # person noticed. The build was already automatic; this is what makes the
      # whole path automatic.
      #
      # `deploy` holds the *output*, never the source: `server.js`, `.next`,
      # `public` and the traced `node_modules`, laid out exactly as the server
      # wants them. A fresh `git init` each run and a force push mean the branch
      # is always a single commit, so twenty deploys do not become twenty
      # copies of `node_modules` in the repository's history.
      #
      # It runs on `main` only. A branch build is for looking at, not for
      # putting on a homestay's domain.
      - name: Publish the built app to the deploy branch
        if: github.ref == 'refs/heads/main'
        working-directory: .next/standalone
        run: |
          set -euo pipefail
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build dari ${GITHUB_SHA:0:7}"
          git push -q -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:deploy
          echo "branch deploy diperbarui dari ${GITHUB_SHA:0:7}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tells the host to pull the branch that was just pushed.
      #
      # This is for a host that hands out a "pull now" URL to paste into
      # GitHub's own Settings -> Webhooks, which Hostinger's shared-hosting
      # Git tool does. Their Node.js hosting does not: it deploys through a
      # GitHub App, watches the connected branch itself, and needs none of
      # this. Kept for the hosts that do, and called from here rather than
      # registered as a repository webhook for one reason: a
      # repository webhook fires the moment a push lands, and the push that
      # matters is the one this workflow makes to `deploy` several minutes after
      # the push to `main` that started it. Wired through GitHub, the ordering
      # is whatever the two happen to do; wired through here, the host is told
      # to pull only once there is something new to pull.
      #
      # Dormant until DEPLOY_HOOK_URL exists. A hook that answers anything other
      # than 2xx fails the run rather than being logged and shrugged at: a
      # deploy that quietly did not happen is the exact failure this whole step
      # exists to remove.
      - name: Tell the host to pull the new build
        if: github.ref == 'refs/heads/main' && env.DEPLOY_HOOK_URL != ''
        run: |
          set -euo pipefail
          code=$(curl -sS -X POST -m 60 \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -o hook-response.txt -w '%{http_code}' \
            "$DEPLOY_HOOK_URL")
          echo "webhook menjawab $code"
          head -c 500 hook-response.txt || true
          echo
          case "$code" in
            2*) echo "host diberi tahu" ;;
            *) echo "::error::webhook deploy menjawab $code"; exit 1 ;;
          esac

      # The other way to close the last hop: push the build to the server
      # instead of waiting for the server to pull it.
      #
      # Dormant until `SSH_HOST` exists, so the workflow behaves exactly as
      # before for anyone who has not set it up. Preferred order is still the
      # `deploy` branch above, because Hostinger's own Git integration handles
      # the restart and this cannot: what a panel-managed Node process needs in
      # order to pick up new files is the one part of this that has never been
      # tested against the real server.
      #
      # Extracts into a staging directory and only then swaps, so a transfer cut
      # halfway leaves the running site alone rather than half-replaced. The
      # previous release is kept as `.prev` for exactly one deploy, which is the
      # difference between a bad deploy costing a minute and costing an evening.
      - name: Deploy over SSH
        if: github.ref == 'refs/heads/main' && env.SSH_HOST != ''
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust on first use. Weaker than pinning the key, and said out loud
            # rather than hidden: set SSH_KNOWN_HOSTS to remove the window.
            echo "SSH_KNOWN_HOSTS kosong, memakai ssh-keyscan (trust on first use)"
            ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          SSH="ssh -i ~/.ssh/id_deploy -p $PORT -o BatchMode=yes $SSH_USER@$SSH_HOST"
          scp -i ~/.ssh/id_deploy -P "$PORT" dist/app.tar.gz \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/../app-incoming.tar.gz"

          $SSH bash -se <<REMOTE
          set -euo pipefail
          cd "$DEPLOY_PATH/.."
          rm -rf .staging && mkdir -p .staging
          tar -xzf app-incoming.tar.gz -C .staging
          test -f .staging/server.js
          test -d .staging/.next/static
          rm -rf "\$(basename "$DEPLOY_PATH").prev"
          mv "$DEPLOY_PATH" "\$(basename "$DEPLOY_PATH").prev"
          mv .staging "$DEPLOY_PATH"
          rm -f app-incoming.tar.gz
          mkdir -p "$DEPLOY_PATH/tmp" && touch "$DEPLOY_PATH/tmp/restart.txt"
          REMOTE

          echo "terkirim ke $SSH_HOST:$DEPLOY_PATH"

      # Waits until the address actually serves this build, so "deployed" is
      # something observed rather than something assumed.
      #
      # `/version.json` is written by scripts/package.mjs and carries the commit
      # the folder was built from. Polling it turns the last hop from a button
      # somebody has to remember into a step that either goes green or says out
      # loud that the site is still serving the old build.
      #
      # `SITE_URL` alone is enough to switch this on, and that is the case that
      # matters most. Hostinger's Node.js hosting deploys through a GitHub App
      # rather than a pasted webhook, so a site can already be deploying on
      # every push with neither DEPLOY_HOOK_URL nor SSH_HOST ever set. Gated on
      # those two alone, this would stay asleep for exactly the setup it exists
      # to reassure, and "it should be automatic by now" would go on being a
      # belief rather than a fact.
      #
      # Still opt-in rather than on by default: otherwise the run goes red on
      # every push for anyone deploying by hand, and a workflow that is always
      # red is a workflow nobody reads.
      - name: Wait for the site to serve it
        if: github.ref == 'refs/heads/main' && (env.DEPLOY_HOOK_URL != '' || env.SSH_HOST != '' || env.SITE_URL != '')
        run: |
          set -euo pipefail
          BASE="${SITE_URL:-}"
          if [ -z "$BASE" ] && [ -n "${SITE_DOMAIN_EDDO:-}" ]; then
            BASE="https://${SITE_DOMAIN_EDDO}"
          fi
          if [ -z "$BASE" ]; then
            echo "SITE_URL dan SITE_DOMAIN_EDDO dua-duanya kosong, tidak ada yang bisa diperiksa"
            exit 0
          fi
          echo "menunggu $BASE/version.json menyebut ${GITHUB_SHA:0:7}"

          # Ten minutes. A pull and a restart take seconds; the headroom is for
          # a host that queues the job behind something else.
          for i in $(seq 1 40); do
            live=$(curl -fsS -m 20 "$BASE/version.json" 2>/dev/null | jq -r '.commit // ""' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "tayang setelah $(( (i - 1) * 15 )) detik"
              exit 0
            fi
            short="${live:0:7}"
            echo "  masih ${short:-tidak terbaca}, menunggu..."
            sleep 15
          done

          echo "::error::sepuluh menit dan $BASE masih belum menyajikan ${GITHUB_SHA:0:7}"
          exit 1
