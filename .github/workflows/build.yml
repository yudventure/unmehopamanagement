# Builds the application somewhere with enough memory, so the server does not
# have to have any.
#
# Measured on this repository: `next build` peaks at about 1.4 GB of resident
# memory across its worker processes. That is comfortable on a build machine
# and is the single thing most likely to fail on shared hosting, where the
# ceiling belongs to the plan rather than to the machine. Building here removes
# the question instead of answering it.
#
# The output is `app.tar.gz`, which unpacks into a folder that runs with one
# command and no `npm install`. Download it from the run's Artifacts section.
#
# Vercel is untouched by this. It keeps building from the same repository the
# way it does today; this is a second way out, not a replacement.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed only by the last step, which pushes the built app to its own
    # branch. Everything before it reads.
    permissions:
      contents: write

    # Everything here is read at `next build` and baked into the output, so it
    # has to be present now rather than on the server. Repository variables
    # rather than secrets on purpose: a domain name is public, and anything
    # prefixed NEXT_PUBLIC_ is compiled into the JavaScript the browser
    # downloads, so calling it a secret would be a promise this cannot keep.
    #
    # The real secrets (Midtrans server key, Resend, the CMS password) are read
    # at runtime and belong on the server, never here.
    env:
      SITE_DOMAIN_TURTLE: ${{ vars.SITE_DOMAIN_TURTLE }}
      SITE_DOMAIN_EDDO: ${{ vars.SITE_DOMAIN_EDDO }}
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ vars.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
      NEXT_PUBLIC_LOGIN_HERO: ${{ vars.NEXT_PUBLIC_LOGIN_HERO }}

      # Read by the optional SSH step at the end. Declared at job level rather
      # than on the step, because a step cannot see its own `env` from its `if`,
      # and that `if` is what keeps this whole path dormant until someone adds
      # the secrets.
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - uses: actions/checkout@v4

      # Pinned to the major version the application is developed against. A
      # newer Node is usually fine and occasionally is not, and a build that
      # differs from the one that was tested is not worth the surprise.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` rather than `install`: it installs exactly what the lockfile says
      # and fails if the lockfile and package.json disagree, which is what you
      # want from a build you are going to deploy without looking at.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Copies public/ and .next/static in beside the server, then writes the
      # archive. Without this the site comes up unstyled rather than broken,
      # which is the harder failure to spot.
      - run: npm run package:archive

      # Both formats, because which one an upload form will accept is not
      # knowable from here: Hostinger's lists .zip, .tar and .tar.gz and still
      # refused a .tar.gz, most likely over the filename a browser gave it on
      # the way down rather than the bytes inside.
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            dist/app.tar.gz
            dist/app.zip
          retention-days: 14

      # Publishes the built application to a branch of its own, so the host can
      # deploy by pulling instead of waiting for somebody to download an
      # archive and upload it again.
      #
      # That last step was the one part of the chain still done by hand, which
      # meant every price the owner changed in the CMS sat in GitHub until a
      # person noticed. The build was already automatic; this is what makes the
      # whole path automatic.
      #
      # `deploy` holds the *output*, never the source: `server.js`, `.next`,
      # `public` and the traced `node_modules`, laid out exactly as the server
      # wants them. A fresh `git init` each run and a force push mean the branch
      # is always a single commit, so twenty deploys do not become twenty
      # copies of `node_modules` in the repository's history.
      #
      # It runs on `main` only. A branch build is for looking at, not for
      # putting on a homestay's domain.
      - name: Publish the built app to the deploy branch
        if: github.ref == 'refs/heads/main'
        working-directory: .next/standalone
        run: |
          set -euo pipefail
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build dari ${GITHUB_SHA:0:7}"
          git push -q -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:deploy
          echo "branch deploy diperbarui dari ${GITHUB_SHA:0:7}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The other way to close the last hop: push the build to the server
      # instead of waiting for the server to pull it.
      #
      # Dormant until `SSH_HOST` exists, so the workflow behaves exactly as
      # before for anyone who has not set it up. Preferred order is still the
      # `deploy` branch above, because Hostinger's own Git integration handles
      # the restart and this cannot: what a panel-managed Node process needs in
      # order to pick up new files is the one part of this that has never been
      # tested against the real server.
      #
      # Extracts into a staging directory and only then swaps, so a transfer cut
      # halfway leaves the running site alone rather than half-replaced. The
      # previous release is kept as `.prev` for exactly one deploy, which is the
      # difference between a bad deploy costing a minute and costing an evening.
      - name: Deploy over SSH
        if: github.ref == 'refs/heads/main' && env.SSH_HOST != ''
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust on first use. Weaker than pinning the key, and said out loud
            # rather than hidden: set SSH_KNOWN_HOSTS to remove the window.
            echo "SSH_KNOWN_HOSTS kosong, memakai ssh-keyscan (trust on first use)"
            ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          SSH="ssh -i ~/.ssh/id_deploy -p $PORT -o BatchMode=yes $SSH_USER@$SSH_HOST"
          scp -i ~/.ssh/id_deploy -P "$PORT" dist/app.tar.gz \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/../app-incoming.tar.gz"

          $SSH bash -se <<REMOTE
          set -euo pipefail
          cd "$DEPLOY_PATH/.."
          rm -rf .staging && mkdir -p .staging
          tar -xzf app-incoming.tar.gz -C .staging
          test -f .staging/server.js
          test -d .staging/.next/static
          rm -rf "\$(basename "$DEPLOY_PATH").prev"
          mv "$DEPLOY_PATH" "\$(basename "$DEPLOY_PATH").prev"
          mv .staging "$DEPLOY_PATH"
          rm -f app-incoming.tar.gz
          mkdir -p "$DEPLOY_PATH/tmp" && touch "$DEPLOY_PATH/tmp/restart.txt"
          REMOTE

          echo "terkirim ke $SSH_HOST:$DEPLOY_PATH"
